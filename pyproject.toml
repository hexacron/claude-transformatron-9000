[project]
name = "transformatron"
version = "0.1.0"
description = "MCP control plane for a local Maltego v3 transform server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "mcp==2.0.0",
    # Upper-bounded by maltego-transforms 1.0.1, which pins httpx>=0.27.2,<0.28.0
    "httpx==0.27.2",
    "maltego-transforms==1.0.1",
    "maltego-transforms-std-entities==1.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.2",
    "ty==0.0.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformatron"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The SDK owns the files it generates under server/ (.agents/, project.py, __init__.py) —
# linting them would churn against upstream on every regeneration. Everything else under
# server/ (transforms/, middleware.py, discovery.py) is project code and is linted.
extend-exclude = [
    "server/.agents",
    "server/project.py",
    "server/__init__.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
