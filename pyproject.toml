[project]
name = "transformatron"
version = "0.1.0"
description = "MCP control plane for a local Maltego v3 transform server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "mcp==2.0.0",
    # Upper-bounded by maltego-transforms 1.0.1, which pins httpx>=0.27.2,<0.28.0
    "httpx==0.27.2",
    "maltego-transforms==1.0.1",
    "maltego-transforms-std-entities==1.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.2",
    "ty==0.0.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformatron"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The SDK owns everything under server/ except transforms/ — linting generated files
# would churn against upstream on every regeneration. transforms/ is user code that
# happens to live inside the generated tree, so it is linted like the rest of the project.
extend-exclude = [
    "server/.agents",
    "server/project.py",
    "server/__init__.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
